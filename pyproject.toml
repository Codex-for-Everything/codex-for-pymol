[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pymol-codex"
version = "0.2.34"
description = "A cross-platform Codex chat plugin for PyMOL"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Huawei Wu" }]

[tool.hatch.build.targets.wheel]
packages = ["src/pymol_codex"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/docs",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]
