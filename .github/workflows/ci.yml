name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.8", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build frontend
        run: python -m pip install build==1.2.2.post1
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build wheel and source distribution with Hatchling
        run: python -m build
      - name: Build PyMOL plugin
        run: python scripts/build_plugin.py
      - name: Import plugin zip
        run: python -c "import sys; sys.path.insert(0, 'dist/pymol_codex_plugin.zip'); import pymol_codex; print(pymol_codex.__version__)"
