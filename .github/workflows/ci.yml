name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        # Python 3.8 is unavailable on GitHub's ARM64 macOS runners. Keep the
        # minimum-version check on Intel and test a newer supported Python on
        # ARM64.
        include:
          - os: macos-15-intel
            python-version: "3.8"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.8"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build frontend
        run: python -m pip install build==1.2.2.post1
      - name: Unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build wheel and source distribution with Hatchling
        run: python -m build
      - name: Build PyMOL plugin
        run: python scripts/build_plugin.py
      - name: Import plugin zip
        run: python -c "import sys; sys.path.insert(0, 'dist/codex-for-pymol.zip'); import codex_for_pymol; print(codex_for_pymol.__version__)"
