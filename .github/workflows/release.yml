name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test before release
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build release assets
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify release commit belongs to main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main; then
            echo "::error::Release tags must point to a commit contained in main."
            exit 1
          fi
      - name: Verify tag and package versions
        env:
          PYTHONPATH: src
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python -c "import os, tomllib;
          from pathlib import Path;
          from codex_for_pymol.version import __version__;
          configured = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'];
          assert configured == __version__, f'pyproject version {configured!r} does not match package version {__version__!r}';
          expected = 'v' + __version__;
          actual = os.environ['RELEASE_TAG'];
          assert actual == expected, f'release tag {actual!r} must be {expected!r}'"
      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check build==1.2.2.post1
      - name: Build Python distributions with Hatchling
        run: python -m build
      - name: Build PyMOL plugin
        run: python scripts/build_plugin.py
      - name: Import plugin zip
        run: >-
          python -c "import sys; from pathlib import Path;
          packages = list(Path('dist').glob('codex-for-pymol-*.zip'));
          assert len(packages) == 1, packages;
          package = packages[0];
          sys.path.insert(0, str(package));
          import codex_for_pymol;
          assert package.name == f'codex-for-pymol-{codex_for_pymol.__version__}.zip';
          print(codex_for_pymol.__version__)"
      - name: Generate SHA-256 checksum
        run: >-
          python -c "from hashlib import sha256;
          from pathlib import Path;
          packages = list(Path('dist').glob('codex-for-pymol-*.zip'));
          assert len(packages) == 1, packages;
          package = packages[0];
          digest = sha256(package.read_bytes()).hexdigest();
          Path('dist/SHA256SUMS.txt').write_text(f'{digest}  {package.name}\n', encoding='ascii')"
      - name: Preserve release assets
        uses: actions/upload-artifact@v5
        with:
          name: release-assets-${{ github.ref_name }}
          path: |
            dist/codex-for-pymol-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: release-assets-${{ github.ref_name }}
          path: release-assets
      - name: Verify downloaded checksum
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_INSTALL_NOTES: |-
            0.6.0 新增图片输入：可以通过“添加图片…”、粘贴剪贴板图片或拖放本地图片，将最多四张图片与文字一起发送给 Codex，也可以只发送图片。插件会在发送前验证、缩放并规范化图片，把临时文件保存在当前 PyMOL 会话的私有运行目录中，并在退出时清理。本版本还完善了附件预览、移除操作和底部面板的布局稳定性。

            重要兼容性更新：使用 0.5.1 或更早版本的用户请升级到 0.5.2 或更高版本并重启 PyMOL。部分较新的 Codex 会通过本地工具宿主转发插件的动态工具；旧版插件可能误将这个必要宿主关闭，导致 Codex 提示无法控制当前 PyMOL。0.5.2 改为根据当前 Codex 实际报告的功能进行兼容，不依赖写死的 Codex 版本号。

            Windows：0.3.2 及更早版本存在按钮文字对比度和部分 Codex CLI 发现/启动问题，请升级到 0.4.0 或更高版本。

            安装：下载 codex-for-pymol-VERSION.zip，并在 PyMOL 插件管理器中直接安装（不要解压）。从 0.2.x 或更早版本升级时，请先卸载旧版插件并重启 PyMOL。

            Version 0.6.0 adds image input: use Add image…, paste a clipboard image, or drag local image files to send up to four images to Codex with text or on their own. Before sending, the plugin validates, resizes, and normalizes images, stores temporary files in the current PyMOL session's private runtime directory, and removes them on exit. This release also improves attachment previews, removal controls, and bottom-panel layout stability.

            Important compatibility update: users of version 0.5.1 or earlier should upgrade to version 0.5.2 or later and restart PyMOL. Some newer Codex installations route the plugin's dynamic tools through a local tool host; earlier plugin releases could disable that required host and make Codex report that live PyMOL control was unavailable. Version 0.5.2 now adapts to capabilities reported by the selected Codex instead of relying on a hard-coded Codex version.

            Windows: versions 0.3.2 and earlier have button-text contrast and Codex CLI discovery/launch issues. Upgrade to version 0.4.0 or later.

            Installation: download codex-for-pymol-VERSION.zip and install it directly with the PyMOL Plugin Manager (do not extract it). When upgrading from 0.2.x or earlier, uninstall the old plugin and restart PyMOL first.
        run: |
          set -euo pipefail
          release_version="${RELEASE_TAG#v}"
          package_path="release-assets/codex-for-pymol-${release_version}.zip"
          release_notes="${RELEASE_INSTALL_NOTES//VERSION/$release_version}"
          if [[ ! -f "$package_path" ]]; then
            echo "::error::Missing release package: $package_path"
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "$package_path" \
            "release-assets/SHA256SUMS.txt" \
            --verify-tag \
            --generate-notes \
            --notes "$release_notes" \
            --title "Codex for PyMOL ${RELEASE_TAG#v}" \
            --latest
